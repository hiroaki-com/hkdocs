<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <!--
    /admin/ 専用 CSP。管理画面は Git Gateway 経由で main への書込権限を扱うため、
    スクリプトの供給元を自ドメインと Netlify Identity だけに限定する。
    - 'unsafe-eval': decap-cms のバンドルが globalThis 補完とプレビュー処理で new Function を使う
    - style-src 'unsafe-inline': decap-cms が実行時にスタイルを注入する
    - frame-src blob:/data:: プレビューペインが srcdoc の iframe を生成する
    - connect-src www.netlifystatus.com: Git Gateway の稼働状態を status_endpoint 既定値
      （https://www.netlifystatus.com/api/v2/components.json）から取得する。遮断しても
      decap-cms 側の catch が「正常」を返すだけで保存は壊れないが、障害検出が効かなくなる
    Identity / Git Gateway は同一オリジンの /.netlify/* 経由のため connect-src 'self' で足りる。
    localhost + localStorage の netlifySiteURL や local_backend で編集する場合は、その
    オリジンを connect-src に追加しないと通信が遮断される。
    frame-ancestors と X-Frame-Options は meta では効かないため、クリックジャッキング対策は
    配信レイヤーでのヘッダー付与（ランブック §7-4）が必要。
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-eval' https://identity.netlify.com;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: https:;
    font-src 'self' data:;
    connect-src 'self' https://identity.netlify.com https://api.netlify.com https://api.github.com https://www.netlifystatus.com;
    frame-src 'self' data: blob:;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  " />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes" />
  <title>Content Manager</title>
  
  <style>
    /* responsive-decap CSS（モバイル対応）｜右CDNベースにカスタム｜https://cdn.jsdelivr.net/gh/hithismani/responsive-decap@main/dist/responsive.min.css） */
    @media (max-width:799px){
      [class*=DropdownList]{
        position:fixed!important;
        min-width:20%!important;
        width:90%!important;
        margin:auto!important;
        height:fit-content!important;
        top:auto!important;
        left:0!important;
        right:0!important;
        bottom:10px!important;
        background:#e6f4fd!important;
        border:2px solid #3a69c7!important;
      }
      [class*=StyledModal]{
        width:90dvw!important;
        width:90%!important;
      }
      [class*=LibraryTitle]{
        display:none!important;
      }
      [class*=CollectionTopNewButton]{
        padding:0 10px!important;
        height:auto!important;
      }
      [class*=LibraryTop]{
        overflow-x:auto!important;
        height:fit-content!important;
        padding-bottom:10px!important;
      }
      [class*=BackCollection]{
        display:none!important;
      }
      [class*=ControlPaneContainer]{
        padding:0 10px!important;
      }
      [class*=BackCollection],[class*=BackStatus]{
        font-size:.6rem!important;
      }
      [class*=AppHeaderContent],[class*=AppMainContainer]{
        margin-right:0!important;
        margin-left:0!important;
        min-width:calc(100vw - 24px)!important;
        max-width:100vw!important;
      }
      [class*=AppHeaderContent]{
        display:flex!important;
        justify-content:space-between!important;
      }
      [class*=AppHeaderQuickNewButton]{
        width:100%!important;
      }
      [class*=AppHeaderButton]{
        padding-left:4px!important;
        padding-right:4px!important;
      }
      [class*=EditorContainer],[class*=ToolbarContainer]{
        min-width:initial!important;
        overflow-x:auto!important;
      }
      [class*=ToolbarSubSectionFirst]{
        display:flex!important;
        flex-direction:column!important;
      }
      [class*=PublishedToolbarButton]{
        padding:0 8px!important;
      }
      [class*=PublishedToolbarButton]::after{
        display:none!important;
      }
      [class*=ToolbarSubSectionFirst]{
        flex-direction:row!important;
      }
      [class*=SearchInput]{
        margin-top:5px!important;
      }
      [class*=PreviewPaneContainer-ControlPaneContainer]{
        padding:0!important;
      }
      [class*=ControlPaneContainer]{
        max-width:100vw!important;
      }
      [class*=EditorControlBar] [class*=ToolbarContainer]{
        display:flex!important;
        flex-direction:column!important;
      }
      [class*=CollectionContainer]{
        display:flex!important;
        flex-direction:column!important;
      }
      [class*=SidebarContainer]{
        position:initial!important;
        width:initial!important;
      }
      [class*=CollectionMain]{
        padding-left:0!important;
        margin-top:20px!important;
      }

      /* iOS自動ズーム防止 */
      [data-slate-editor="true"],
      [role="textbox"],
      .cm-editor,
      input,
      textarea,
      select {
        font-size: 16px !important;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', 'Yu Gothic UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      /* プルツーリフレッシュを無効化 */
      overscroll-behavior-y: contain;
    }

    html {
      overscroll-behavior: contain;
    }
  </style>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>


  <!--
    decap-cms はセルフホスト（unpkg の範囲指定 `decap-cms@^3.0.0` を廃止）。
    版は npm レジストリの tarball integrity を検証して取り込んだ 3.15.1 で固定。
    チャンクは currentScript.src を基点に同ディレクトリから読まれるため、
    更新時は decap-cms/<新版>/ を追加して src を差し替え、旧ディレクトリを削除する。
  -->
  <script src="decap-cms/3.15.1/decap-cms.js"></script>

  <script src="admin.js"></script>
</body>
</html>
