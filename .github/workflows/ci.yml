# .github/workflows/ci.yml

name: CI Build Check

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: read

jobs:
  build_check:
    name: Verify Build Success
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # package.jsonの"packageManager"フィールドからpnpmのバージョンを読み込む
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # .nvmrcを基にNode.jsをセットアップし、pnpmの依存関係キャッシュを有効化
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # Docusaurusのビルドキャッシュを復元・保存し、差分ビルドを高速化
      - name: Cache Docusaurus build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .docusaurus
          key: ${{ runner.os }}-docusaurus-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-docusaurus-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Type Check
        run: pnpm typecheck

      # --no-minifyでアセット最小化をスキップし、ビルドの妥当性のみを高速に検証
      - name: Run Build
        run: pnpm build --no-minify        