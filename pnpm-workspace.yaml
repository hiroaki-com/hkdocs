  fast-uri: ^3.1.9          # GHSA-q3j6-qgpj-74h6 / v39h / 4c8g / v2hh / 7p8r / w74x / xhq7 / wjr9 / 333x
  js-yaml@4: ^4.3.2         # GHSA-mh29-5h37-fv8m / h67p / 52cp / 5p4m
  lodash: ^4.18.1           # GHSA-xxjr-mmjv-4gpg / f23m / r5fr
  qs: ^6.16.0               # GHSA-4mjr-xmp4-gh2g / x5fp
  serialize-javascript: ^7.1.3  # GHSA-5c6j-r48x-rmvq / qj8w / m5mm
  tinypool: ^2.1.2          # GHSA-5gmw-xhrv-c9v3 / 85c8-ppgw-ccpr
  webpack: ^5.109.2         # GHSA-38r7-794h-5758 / 8fgc
